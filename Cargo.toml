[package]
name = "wordcast"
version = "0.1.0"
edition = "2024"
description = "A multi-language vocabulary reader powered by macOS `say`"
license = "MIT"

[[bin]]
name = "caw"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
dirs = "5"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
